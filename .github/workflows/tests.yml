name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portal-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated gateway test dependencies
        run: sudo apt-get update && sudo apt-get install -y network-manager dnsmasq-base nftables iproute2 dbus
      - name: Real captive portal in isolated network namespaces
        run: sudo python3 tests/portal_netns_smoke.py
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.3
      - name: Install Nmap for the isolated loopback smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Lint and format
        run: |
          ruff check script.py POLTERHEIST.py tests
          ruff format --check script.py POLTERHEIST.py tests
      - name: Offline regressions and loopback Nmap integration
        run: python -m unittest discover -s tests -v
  kali:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
      # Kali's Nmap executable requests this capability when it starts.
      options: --cap-add=NET_ADMIN
    timeout-minutes: 15
    steps:
      - name: Bootstrap Python and checkout dependencies
        run: apt-get update && apt-get install -y python3 git ca-certificates
      - uses: actions/checkout@v4
      - name: Install through POLTERHEIST setup
        run: python3 script.py --setup
      - name: Verify Kali detection and dependencies
        run: |
          .venv/bin/python -c "import script; assert script.operating_system()['id'] == 'kali'; script.require_tools('iw', 'ip', 'nmcli', 'tcpdump', 'nmap'); script.load_upstream()"
          nmap --version
          .venv/bin/python script.py --check
      - name: Offline regressions on Kali
        run: .venv/bin/python -m unittest discover -s tests -v
