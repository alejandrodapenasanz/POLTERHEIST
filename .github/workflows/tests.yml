name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.3
      - name: Install Nmap for the isolated loopback smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Lint and format
        run: |
          ruff check script.py POLTERHEIST.py tests
          ruff format --check script.py POLTERHEIST.py tests
      - name: Offline regressions and loopback Nmap integration
        run: python -m unittest discover -s tests -v
